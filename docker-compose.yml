# Full stack: PostgreSQL (JSONB + full-text search), Redis Streams, FastAPI (+ pipeline worker), React via Nginx.
#   cp .env.example .env    (set GEMINI_API_KEY, change the secrets)
#   docker compose up --build        ->  http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sla
      POSTGRES_USER: sla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sla_dev_password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla -d sla"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sla:${POSTGRES_PASSWORD:-sla_dev_password}@postgres:5432/sla
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_API_KEY: ${DEMO_API_KEY:-sla_demo_ingest_key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  # extra consumer in the same Redis consumer group - scale with:  docker compose up --scale worker=3
  worker:
    build: ./backend
    command: ["python", "-m", "app.pipeline.processor"]
    environment:
      DATABASE_URL: postgresql+psycopg://sla:${POSTGRES_PASSWORD:-sla_dev_password}@postgres:5432/sla
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on: [api]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  redisdata:
